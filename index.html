<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zockplan</title>
<meta name="description" content="Zockplan und eure Spiele an einem Ort.">
<meta name="theme-color" content="#f2f3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09080f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zockplan">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="./app.css">
<style>
  /* Startseite: Auswahl zwischen Zockplan und den Spielen */
  .hub{max-width:940px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .hubhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 2px 22px}
  .hubhead p{margin:0;color:var(--muted);font-size:14px;font-weight:600}
  .hubhead h1{margin:2px 0 0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .tile{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;color:var(--fg);text-decoration:none;transition:transform .15s,box-shadow .15s}
  .tile:hover{transform:translateY(-2px)}
  .tile:active{transform:scale(.985)}
  .tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .tart{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
  .tart img{display:block}
  .tart.plan{background:radial-gradient(circle at 30% 20%,#3b2f8a,transparent 60%),linear-gradient(135deg,#231d55,#0e0c24)}
  .tart.plan img{width:42%;max-width:150px;border-radius:24%;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .tart.cover img{width:100%;height:100%;object-fit:cover}
  .tart.tower img{object-position:left top}
  .tbody{display:flex;align-items:center;gap:12px;padding:14px 16px 16px}
  .ttext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ttext b{font-size:18px;letter-spacing:-.02em}
  .ttext span{font-size:13.5px;color:var(--muted);line-height:1.35}
  .tgo{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--ink),.08)}
  .tgo svg{width:18px;height:18px}
  .tbadge{font-style:normal;position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#0b2a17;background:rgba(220,255,232,.92);box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .tbadge::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c46f}
  @media (max-width:640px){
    .hubhead h1{font-size:26px}
    .tiles{grid-template-columns:1fr;gap:14px}
    .tart{aspect-ratio:2/1}
  }
</style>
</head>
<body>
<main class="hub">
  <header class="hubhead">
    <div>
      <p id="hubDate"></p>
      <h1 id="hubHello">Hallo</h1>
    </div>
    <button class="icon-btn glass" id="lookBtn" type="button" aria-label="Hell oder dunkel"></button>
  </header>

  <nav class="tiles" aria-label="Auswahl">
    <a class="tile glass" href="./plan.html">
      <span class="tart plan"><img src="./icons/icon.svg" alt=""></span>
      <span class="tbody">
        <span class="ttext"><b>Zockplan</b><span>Wann habt ihr Zeit – und was wird gezockt?</span></span>
        <span class="tgo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span>
    </a>
    <a class="tile glass" href="./frost-grill/">
      <span class="tart cover"><img src="./frost-grill/cover.jpg" alt="" loading="lazy"><em class="tbadge">Auch offline</em></span>
      <span class="tbody">
        <span class="ttext"><b>Frost-Grill Tycoon</b><span>Bau deinen Imbiss im verschneiten Wald zum Winter-Restaurant aus.</span></span>
        <span class="tgo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span>
    </a>
    <a class="tile glass" href="./fortschritt/">
      <span class="tart cover tower"><img src="./fortschritt/cover.jpg" alt="" loading="lazy"></span>
      <span class="tbody">
        <span class="ttext"><b>Fortschrittsturm</b><span>Eure Minecraft-Achievements in der Welt ALLARCH.</span></span>
        <span class="tgo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span>
    </a>
  </nav>
</main>

<script>
  /* Begrüßung und Datum */
  (() => {
    const now = new Date(), h = now.getHours();
    document.getElementById('hubHello').textContent = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend';
    document.getElementById('hubDate').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  })();
  /* Hell / Dunkel – gleiche Einstellung wie im Zockplan */
  (() => {
    const SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8Z"/></svg>';
    const btn = document.getElementById('lookBtn');
    let look = 'light'; try { look = localStorage.getItem('zockplan-look') || 'light'; } catch (e) {}
    const set = l => {
      if (l === 'dark') document.documentElement.dataset.look = 'dark'; else delete document.documentElement.dataset.look;
      btn.innerHTML = l === 'dark' ? SUN : MOON;
      btn.setAttribute('aria-label', l === 'dark' ? 'Helles Design' : 'Dunkles Design');
      try { localStorage.setItem('zockplan-look', l); } catch (e) {}
    };
    set(look);
    btn.onclick = () => { look = look === 'dark' ? 'light' : 'dark'; set(look); };
  })();
</script>
<script type="module" src="./pwa.js"></script>
</body>
</html>
